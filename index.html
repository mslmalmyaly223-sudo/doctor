<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار تسجيل الدخول - SuperQi</title>
    <!-- استدعاء مكاتب فايربيس (النسخة 8 الأسهل للويب) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; background-color: #f9f9f9; }
        .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input, button { width: 95%; padding: 10px; margin: 10px 0; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #D96300; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #b55300; }
        #step2 { display: none; }
        #result { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body> 

    <div class="container">
        <h2>بيئة اختبار SuperQi</h2>
        
        <!-- الخطوة 1: إدخال الرقم -->
        <div id="step1">
            <label>رقم الهاتف (مع رمز الدولة، مثلاً +964...):</label>
            <input type="text" id="phoneNumber" placeholder="+96477...">
            
            <!-- حاوية اختبار أنا لست روبوت -->
            <div id="recaptcha-container"></div>
            
            <button onclick="sendOTP()">إرسال رمز التحقق</button>
        </div>

        <!-- الخطوة 2: إدخال الرمز -->
        <div id="step2">
            <label>رمز التحقق (OTP):</label>
            <input type="text" id="otpCode" placeholder="أدخل الرمز المكون من 6 أرقام">
            <button onclick="verifyOTP()">تسجيل الدخول</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        // إعدادات فايربيس المستخرجة من ملف تطبيقك
        const firebaseConfig = {
            apiKey: "AIzaSyCwo59fqMOEU5lntAny5Nhe3qDPa4qY6TE",
            authDomain: "aplus-and-qicard-test-project.firebaseapp.com",
            databaseURL: "https://aplus-and-qicard-test-project-default-rtdb.firebaseio.com",
            projectId: "aplus-and-qicard-test-project",
            storageBucket: "aplus-and-qicard-test-project.appspot.com",
            messagingSenderId: "249201149700",
            appId: "1:249201149700:android:698534e47d34c9c124f251"
        };

        // تهيئة الفايربيس
        firebase.initializeApp(firebaseConfig);

        // إعداد اختبار الروبوت
        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
            'size': 'normal',
            'callback': (response) => {
                // تم حل الاختبار بنجاح
            }
        });

        let confirmationResult;

        // دالة إرسال الرمز
        function sendOTP() {
            const phoneNumber = document.getElementById("phoneNumber").value;
            const appVerifier = window.recaptchaVerifier;

            document.getElementById("result").style.color = "blue";
            document.getElementById("result").innerText = "جاري الإرسال...";

            firebase.auth().signInWithPhoneNumber(phoneNumber, appVerifier)
                .then((result) => {
                    confirmationResult = result;
                    document.getElementById("step1").style.display = "none";
                    document.getElementById("step2").style.display = "block";
                    document.getElementById("result").style.color = "green";
                    document.getElementById("result").innerText = "تم إرسال الرمز بنجاح! يرجى فحص هاتفك.";
                }).catch((error) => {
                    document.getElementById("result").style.color = "red";
                    document.getElementById("result").innerText = "خطأ في الإرسال: " + error.message;
                    window.recaptchaVerifier.render().then(function(widgetId) {
                        grecaptcha.reset(widgetId);
                    });
                });
        }

        // دالة التحقق وتسجيل الدخول
        function verifyOTP() {
            const code = document.getElementById("otpCode").value;
            
            document.getElementById("result").style.color = "blue";
            document.getElementById("result").innerText = "جاري التحقق...";

            confirmationResult.confirm(code).then((result) => {
                const user = result.user;
                document.getElementById("result").style.color = "green";
                document.getElementById("result").innerHTML = "<h3>تم تسجيل الدخول بنجاح!</h3><p>الآيدي الخاص بك (UID): " + user.uid + "</p>";
                
            }).catch((error) => {
                document.getElementById("result").style.color = "red";
                document.getElementById("result").innerText = "الرمز خاطئ أو منتهي الصلاحية: " + error.message;
            });
        }
    </script>
</body>
</html>
